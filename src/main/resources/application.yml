spring:
  application:
    name: OrderService

  liquibase:
    change-log: classpath:/db/db.changelog.yaml
    url: jdbc:postgresql://127.0.0.1:5432/ordersDB
    user: postgres
    password: password


  r2dbc:
    url: r2dbc:postgresql://localhost:5432/ordersDB
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true


logging:
  level:
    org.springframework.r2dbc.connection: DEBUG
    org.springframework.data.r2dbc.core: DEBUG
    org.hibernate.SQL: DEBUG

server:
  port: ${SERVER_PORT:8081}






