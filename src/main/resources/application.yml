spring:
  application:
    name: OrderService

  liquibase:
    change-log: classpath:/db/db.changelog.yaml
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ordersDB}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ordersDB}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.r2dbc.connection: DEBUG
    org.springframework.data.r2dbc.core: DEBUG
    org.hibernate.SQL: DEBUG

server:
  port: ${SERVER_PORT:8081}
