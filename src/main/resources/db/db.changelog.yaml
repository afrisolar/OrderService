databaseChangeLog:

  - changeSet:
      id: 01-create-item-table
      author: celyn
      changes:
        - createTable:
            schema: public
            tableName: customer_order
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  startWith: 100
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValue: 1
                  constraints:
                    nullable: false
              - column:
                  name: order_number
                  type: varchar(15)
                  defaultValue: 1
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: varchar(15)
                  defaultValue: 1
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: varchar(15)
                  defaultValue: 1
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: int
                  defaultValue: 1
                  constraints:
                    nullable: true
              - column:
                  name: amount
                  type: double
                  defaultValue: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false