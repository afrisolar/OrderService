name: OrderService CI/CD workflow

on:
  push:
    branches: [ "integration" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: test_database
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd="pg_isready -U test_user -d test_database"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    # Step 1: Checkout the code
    - uses: actions/checkout@v4

    # Step 2: Set up JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Step 3: Wait for PostgreSQL readiness
    - name: Wait for PostgreSQL
      run: |
        until psql -h localhost -U test_user -d test_database -c "SELECT 1"; do
          echo "Waiting for PostgreSQL to be ready..."
          sleep 5
        done
      env:
        PGPASSWORD: test_password

    # Step 4: Initialize Database
    - name: Initialize PostgreSQL Database
      run: |
        psql -h localhost -U test_user -c "CREATE DATABASE ordersDB;"
        psql -h localhost -U test_user -d ordersDB -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
      env:
        PGPASSWORD: test_password

    # Step 5: Build the project with Maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    # Step 6: Run Unit Tests
    - name: Run Unit Tests
      env:
        SPRING_LIQUIBASE_URL: jdbc:postgresql://localhost:5432/test_database
        SPRING_LIQUIBASE_USER: test_user
        SPRING_LIQUIBASE_PASSWORD: test_password
      run: mvn -B test --file pom.xml
      
    - name: Generate Code Coverage
      run: mvn jacoco:report --file pom.xml

    # Step 7: Run Integration Tests
    - name: Run Integration Tests
      run: mvn -B verify --file pom.xml

    # Step 8: Update dependency graph
    - name: Update dependency graph
      run: mvn com.github.ferstl:depgraph-maven-plugin:4.0.1:graph --file pom.xml
